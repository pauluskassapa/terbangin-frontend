<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="../../js/theme.js"></script>
  <link rel="icon" type="image/x-icon" href="../../favicon.ico">
  <title>Lupa Kata Sandi — TERBANGIN</title>
  <link rel="stylesheet" href="../../css/flight.css">
  <link rel="stylesheet" href="../../css/account.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <script src="../../js/navbar.js" defer></script>
  <link rel="stylesheet" href="../../css/theme.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="account-page">
    <section class="account-card" aria-labelledby="reset-title">
      <p class="account-eyebrow">Bantuan akun</p>
      <h1 id="reset-title">Lupa kata sandi?</h1>
      <p class="account-intro">Reset demo lokal dengan email dan username yang tersimpan di browser ini. Tidak ada email verifikasi; gunakan hanya untuk data demo.</p>

      <form class="account-form" id="reset-form" novalidate>
        <label for="reset-email">Alamat email
          <input id="reset-email" name="email" type="email" placeholder="nama@email.com" autocomplete="email" required>
        </label>

        <label for="reset-username">Username
          <input id="reset-username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9._-]{3,20}">
        </label>

        <label for="reset-password">Kata sandi baru
          <input id="reset-password" name="newPassword" type="password" autocomplete="new-password" required minlength="8">
        </label>

        <label for="reset-confirm-password">Konfirmasi kata sandi baru
          <input id="reset-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8">
        </label>

        <p class="account-status" id="reset-status" role="status" aria-live="polite"></p>
        <button type="submit">Reset Kata Sandi</button>
      </form>

      <p class="account-signup"><a href="login.html">Kembali ke halaman masuk</a></p>
    </section>
  </main>

  <footer>
    <p>© 2026 TERBANGIN. Mau ke mana? TERBANGIN aja.</p>
  </footer>
  <script src="../../js/account.js"></script>
</body>
</html>
